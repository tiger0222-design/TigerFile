<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISO 證書到期日管理</title>
    <style>
      :root {
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f3f6fb;
        color: #1f2937;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin-top: 0;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        margin-bottom: 18px;
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        font-size: 0.92rem;
        gap: 6px;
      }
      input {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        font-size: 0.95rem;
      }
      .actions {
        grid-column: 1/-1;
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      .primary {
        background: #2563eb;
        color: white;
      }
      .secondary {
        background: #e2e8f0;
        color: #1e293b;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid #e5e7eb;
        padding: 10px 8px;
        text-align: left;
        font-size: 0.92rem;
      }
      thead th {
        background: #f8fafc;
      }
      tr.red {
        background: #fee2e2;
      }
      tr.yellow {
        background: #fef9c3;
      }
      tr.green {
        background: #dcfce7;
      }
      tr.white {
        background: #ffffff;
      }
      .tag {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .remind {
        background: #f97316;
        color: #fff;
      }
      .ok {
        background: #64748b;
        color: #fff;
      }
      .muted {
        color: #64748b;
        font-size: 0.86rem;
      }
      @media (max-width: 860px) {
        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }
        thead {
          display: none;
        }
        tr {
          margin-bottom: 10px;
          border-radius: 8px;
          overflow: hidden;
        }
        td {
          display: flex;
          justify-content: space-between;
          gap: 12px;
        }
        td::before {
          content: attr(data-label);
          font-weight: 600;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ISO 證書到期日管理 APP</h1>

      <section class="card">
        <form id="certForm">
          <label>
            類別
            <input name="category" required placeholder="如：品質、環安衛" />
          </label>
          <label>
            ISO 管理系統
            <input name="system" required placeholder="如：ISO 9001" />
          </label>
          <label>
            廠區
            <input name="site" required placeholder="如：台中廠" />
          </label>
          <label>
            證書到期日
            <input name="expiry" type="date" required />
          </label>
          <label>
            負責人
            <input name="owner" required placeholder="姓名" />
          </label>
          <label>
            負責人郵件信箱
            <input name="email" type="email" required placeholder="name@example.com" />
          </label>
          <div class="actions">
            <button class="primary" type="submit">新增證書</button>
            <button class="secondary" type="button" id="seedDemo">載入示範資料</button>
          </div>
        </form>
        <p class="muted">顏色規則：小於 60 天（紅）、60-120 天（黃）、120-180 天（綠）、大於 180 天（白）。</p>
      </section>

      <section class="card">
        <table>
          <thead>
            <tr>
              <th>類別</th>
              <th>ISO 管理系統</th>
              <th>廠區</th>
              <th>到期日</th>
              <th>剩餘天數</th>
              <th>負責人</th>
              <th>信箱</th>
              <th>提醒狀態</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </div>

    <script>
      const rows = document.getElementById("rows");
      const form = document.getElementById("certForm");
      const seedBtn = document.getElementById("seedDemo");
      const DAY = 24 * 60 * 60 * 1000;
      const certificates = [];

      function daysLeft(expiryStr) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const expiry = new Date(expiryStr);
        expiry.setHours(0, 0, 0, 0);
        return Math.ceil((expiry - today) / DAY);
      }

      function colorClass(days) {
        if (days < 60) return "red";
        if (days <= 120) return "yellow";
        if (days <= 180) return "green";
        return "white";
      }

      function reminderBadge(days) {
        if (days > 180) {
          return '<span class="tag ok">尚未進入提醒區間</span>';
        }
        if (days >= 0 && days % 30 === 0) {
          return '<span class="tag remind">今日需提醒</span>';
        }
        if (days < 0) {
          return '<span class="tag remind">已逾期</span>';
        }
        return '<span class="tag ok">下次提醒：剩 ' + (days - (days % 30)) + ' 天</span>';
      }

      function render() {
        const sorted = [...certificates].sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
        rows.innerHTML = sorted
          .map((item) => {
            const left = daysLeft(item.expiry);
            return `
              <tr class="${colorClass(left)}">
                <td data-label="類別">${item.category}</td>
                <td data-label="ISO 管理系統">${item.system}</td>
                <td data-label="廠區">${item.site}</td>
                <td data-label="到期日">${item.expiry}</td>
                <td data-label="剩餘天數">${left}</td>
                <td data-label="負責人">${item.owner}</td>
                <td data-label="信箱">${item.email}</td>
                <td data-label="提醒狀態">${reminderBadge(left)}</td>
              </tr>
            `;
          })
          .join("");
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(form);
        certificates.push({
          category: data.get("category"),
          system: data.get("system"),
          site: data.get("site"),
          expiry: data.get("expiry"),
          owner: data.get("owner"),
          email: data.get("email")
        });
        form.reset();
        render();
      });

      seedBtn.addEventListener("click", () => {
        const today = new Date();
        const dateFromToday = (n) => {
          const d = new Date(today.getTime() + n * DAY);
          return d.toISOString().slice(0, 10);
        };
        certificates.length = 0;
        certificates.push(
          { category: "品質", system: "ISO 9001", site: "台中廠", expiry: dateFromToday(45), owner: "王小明", email: "ming@example.com" },
          { category: "環境", system: "ISO 14001", site: "高雄廠", expiry: dateFromToday(90), owner: "陳美玲", email: "mei@example.com" },
          { category: "職安", system: "ISO 45001", site: "桃園廠", expiry: dateFromToday(150), owner: "林大華", email: "hua@example.com" },
          { category: "能源", system: "ISO 50001", site: "台南廠", expiry: dateFromToday(220), owner: "張志強", email: "chiang@example.com" },
          { category: "食品", system: "ISO 22000", site: "新竹廠", expiry: dateFromToday(180), owner: "吳佳蓉", email: "rong@example.com" }
        );
        render();
      });
    </script>
  </body>
</html>
